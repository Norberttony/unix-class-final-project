services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: postgresdb
    volumes:
      - /mnt/lvm_dir/postgresql_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/create_database.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webnet

  nginx:
    image: nginx:latest
    build:
      context: ./nginx
    ports:
      - "80:80"
    depends_on:
      - webapp
    networks:
      - webnet

  webapp:
    build: ./app
    restart: always
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PORT=5432
      - DB_PASSWORD=password123
      - DB_NAME=postgresdb
    networks:
      - webnet

networks:
  webnet:
