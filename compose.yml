services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: postgresdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
      image: adminer
      restart: always
      ports:
        - 8080:8080

  nginx:
    image: nginx:latest
    build:
      context: ./nginx
    ports:
      - "80:80"
  webapp:
    build: ./app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PORT=5432
      - DB_PASSWORD=password123
      - DB_NAME=postgresdb

volumes:
  pgdata: